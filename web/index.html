<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No black-translucent: iOS 26 blurs the top of pages drawn under the status bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <meta name="theme-color" content="#232136" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#faf4ed" media="(prefers-color-scheme: light)">
  <title>Meals</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-header">
        <span class="brand" id="brand"></span>
        <button type="button" class="icon-button" id="auth-menu" title="Security" hidden></button>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main" id="main">
      <div class="page">
        <header class="page-header">
          <h1 class="view-title" id="view-title"></h1>
          <div class="header-actions" id="header-actions"></div>
        </header>
        <div id="content"></div>
      </div>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>

  <footer class="statusbar">
    <div class="status-left">
      <span class="status-mode normal" id="status-mode">-- NORMAL --</span>
      <span class="status-position" id="status-position"></span>
      <span class="status-sync" id="status-sync" hidden></span>
    </div>
    <div class="status-hints" id="status-hints"></div>
  </footer>
</body>
</html>
